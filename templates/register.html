<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Campus Hardware Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 440px;">
        <h4 class="text-center mb-3 fw-bold">Register Account</h4>

        <form action="/register" method="POST">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password Hint</label>
                <input type="text" name="hint" class="form-control" placeholder="e.g., First pet's name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Role Assignment</label>
                <select name="role" class="form-select">
                    <option value="VIEWER" selected>Viewer</option>
                    <option value="INVENTORY_SPECIALIST">Inventory Specialist</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                Send Verification Code &rarr;
            </button>
        </form>

        <div class="mt-3 text-center small">
            <a href="/login" class="text-decoration-none">&larr; Back to Login</a>
        </div>
    </div>
</body>
</html>
