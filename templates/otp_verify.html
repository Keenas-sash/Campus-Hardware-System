<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Campus Hardware Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 440px; border-radius: 8px;">
    <div class="text-center mb-3">
        <p class="text-primary fw-bold mb-1 small">TWO-STEP VERIFICATION</p>
        <h4 class="fw-bold">Verify Your Email</h4>
        <p class="text-muted small mb-0">Enter the 6-digit verification code sent to your email.</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ action_url }}">
        <div class="mb-3">
            <label for="otp_code" class="form-label text-secondary small">6-Digit Code</label>
            <input 
                type="text" 
                id="otp_code" 
                name="otp_code" 
                maxlength="6" 
                pattern="\d{6}" 
                placeholder="123456" 
                class="form-control form-control-lg text-center fw-bold fs-3" 
                style="letter-spacing: 6px;" 
                required 
                autofocus
            >
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            Verify Code &rarr;
        </button>
    </form>

    <div class="mt-3 text-center">
        <a href="{{ url_for('login') }}" class="text-decoration-none small">&larr; Back to Login</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
