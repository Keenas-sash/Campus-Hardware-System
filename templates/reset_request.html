<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Campus Hardware System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 440px; border-radius: 8px;">
    <h4 class="text-center fw-bold mb-3">Unlock / Reset Password</h4>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/reset-request" method="POST">
        <div class="mb-3">
            <label class="form-label small mb-1">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label small mb-1">Registered Email</label>
            <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label small mb-1">New Password</label>
            <input type="password" name="new_password" class="form-control" required>
            <div class="form-text text-muted small" style="font-size: 0.725rem;">
                8–20 chars, 1 upper, 1 lower, 1 number, 1 special char.
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label small mb-1">Confirm New Password</label>
            <input type="password" name="confirm_password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            Send Verification Code &rarr;
        </button>
    </form>

    <div class="mt-3 text-center small">
        <a href="/login" class="text-decoration-none">&larr; Back to Login</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
