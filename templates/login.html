<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Hardware System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container" style="max-width: 440px;">
    
    <h3 class="text-center mb-4 fw-bold">Campus Hardware System</h3>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Login Card -->
    <div class="card shadow-sm mb-3">
        <div class="card-body p-4">
            <h5 class="card-title text-center mb-3 fw-bold">Login</h5>
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label small mb-1">Username</label>
                    <input type="text" name="username" class="form-control" maxlength="20" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label small mb-1">Password</label>
                    <input type="password" name="password" class="form-control" maxlength="20" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Login</button>
            </form>
        </div>
    </div>

    <!-- Direct Page Action Links (Replaces JS Modals) -->
    <div class="d-flex justify-content-between">
        <a href="/register" class="btn btn-outline-primary btn-sm px-3 fw-semibold">Register</a>
        <a href="/reset-request" class="btn btn-outline-danger btn-sm px-3 fw-semibold">Forgot / Unlock Password</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
