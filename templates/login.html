<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Hardware System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 450px;">
    
    <h3 class="text-center mb-4">Campus Hardware System</h3>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Login Card -->
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <h5 class="card-title text-center">Login</h5>
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" maxlength="20" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" maxlength="20" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Login</button>
            </form>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="d-flex justify-content-between">
        <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#registerModal">Register</button>
        <button class="btn btn-outline-danger btn-sm" data-bs-toggle="modal" data-bs-target="#resetModal">Forgot / Unlock Password</button>
    </div>
</div>

<!-- Register Modal -->
<div class="modal fade" id="registerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
   <!-- Inside login.html Modal Form -->
<!-- Register Modal inside templates/login.html -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 12px; overflow: hidden;">
      
      <!-- Modal Header -->
      <div class="modal-header border-0 pb-0 pt-4 px-4">
        <h4 class="modal-title fw-bold text-dark" id="registerModalLabel">Create Account</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      
      <!-- Modal Body -->
      <div class="modal-body p-4">
        <form action="/register" method="POST">
          
          <div class="mb-3">
            <label class="form-label text-secondary fw-normal mb-1">Username</label>
            <input type="text" name="username" class="form-control form-control-lg fs-6" required>
          </div>
          
          <div class="mb-3">
            <label class="form-label text-secondary fw-normal mb-1">Email</label>
            <input type="email" name="email" class="form-control form-control-lg fs-6" required>
          </div>
          
          <div class="mb-3">
            <label class="form-label text-secondary fw-normal mb-1">Password</label>
            <input type="password" name="password" class="form-control form-control-lg fs-6" required>
          </div>
          
          <div class="mb-3">
            <label class="form-label text-secondary fw-normal mb-1">Password Hint</label>
            <input type="text" name="hint" class="form-control form-control-lg fs-6" required>
          </div>
          
          <div class="mb-4">
            <label class="form-label text-secondary fw-normal mb-1">Role Assignment</label>
            <select name="role" class="form-select form-select-lg fs-6">
              <option value="VIEWER" selected>Viewer</option>
              <option value="INVENTORY_SPECIALIST">Inventory Specialist</option>
              <option value="ADMIN">Admin</option>
            </select>
          </div>
          
          <button type="submit" class="btn btn-primary w-100 py-2.5 fs-6 fw-normal rounded-3" style="background-color: #0d6efd; border: none;">
            Send Verification Code &rarr;
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Reset Password Modal -->
<div class="modal fade" id="resetModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form action="/reset-request" method="POST">
        <div class="modal-header">
          <h5 class="modal-title">Unlock / Reset Password Request</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Registered Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-2">
            <label class="form-label">New Proposed Password</label>
            <input type="password" name="proposed_password" class="form-control" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Reason / Details</label>
            <textarea name="reason" class="form-control" maxlength="255" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-danger">Submit Request to Admin</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
